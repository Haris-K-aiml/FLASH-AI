<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="chat-header">
      <div>
        <h1>FLASH AI</h1>
        <p>Your intelligent virtual assistant</p>
      </div>
        <span class="status"><span class="dot"></span> Online</span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message bot">
        <div class="bubble">Hello! I'm FLASH AI. How can I help you today?</div>
      </div>
    </section>

    <form id="chat-form" class="input-area">
      <input id="user-input" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
